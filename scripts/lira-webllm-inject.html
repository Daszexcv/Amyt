<!--
  Backend redirector + onboarding webhook for the Lira web app.

  1) Chat redirector: the bundled chat UI talks to
     `${syncApiBaseUrl()}/v1/lira/{status,chat}`. `syncApiBaseUrl()` falls back
     to a dead serveo tunnel, so the chat would always 404. We monkey-patch
     `window.fetch` and rewrite any request whose path is
     `/v1/lira/{status,chat}` to our Fly.io backend.

  2) Onboarding webhook: the bundled onboarding writes the full state object
     (profile, cycle settings, period logs, shipping address, etc.) to
     localStorage under `@cycle-tracker/data/v1` with `onboardingDone:true`
     when the user finishes the questionnaire. We watch for that flip and
     POST the data to `/v1/lira/onboarding`, which forwards a formatted
     summary to the owner's Telegram.

  The Fly.io backend (lira-backend on fly.dev) wraps Pollinations.ai for
  the chat (free, no-API-key, OpenAI-compatible) and Telegram Bot API for
  the onboarding notification. That keeps the product zero-friction: any
  user opens the link from Instagram and chats immediately, no flags, no
  signup, no waiting for a model to download.
-->
<script id="lira-llm-script">
/* Lira chat backend redirector + onboarding webhook.
   See lira-webllm-inject.html in scripts/ for the source-of-truth copy. */
(function(){
  'use strict';
  var BACKEND = 'https://lira-backend-leoiurwi.fly.dev';
  var LIRA_PATH_RE = /\/v1\/lira\/(status|chat)(?:\?[^\s]*)?$/;
  var STORAGE_KEY = '@cycle-tracker/data/v1';
  var SUB_SURVEY_KEY = '@lira/sub-survey/v1';
  var SUBSCRIPTION_KEY = '@lira/subscription/v1';
  var DEVICE_KEY = '@lira/sync/device-id/v1';
  var NOTIFY_KEY = '@lira/onboarding-notified/v1';

  if (!window.fetch || window.__liraBackendRoutingInstalled) return;
  window.__liraBackendRoutingInstalled = true;
  window.__liraBackend = { url: BACKEND };

  var nativeFetch = window.fetch.bind(window);

  function getUrl(input){
    if (typeof input === 'string') return input;
    if (input && typeof input.url === 'string') return input.url;
    try { return String(input); } catch (_) { return ''; }
  }
  function rewrite(url){
    var match = LIRA_PATH_RE.exec(url || '');
    if (!match) return null;
    return BACKEND + '/v1/lira/' + match[1] + (match[0].indexOf('?') >= 0 ? match[0].substring(match[0].indexOf('?')) : '');
  }
  function cloneRequestWithUrl(req, newUrl){
    return new Request(newUrl, {
      method: req.method,
      headers: req.headers,
      body: (req.method === 'GET' || req.method === 'HEAD') ? undefined : req.clone().body,
      mode: 'cors',
      credentials: 'omit',
      cache: req.cache,
      redirect: req.redirect,
      referrer: req.referrer,
      integrity: req.integrity
    });
  }

  window.fetch = function(input, init){
    try {
      var url = getUrl(input);
      var newUrl = rewrite(url);
      if (!newUrl) return nativeFetch(input, init);
      if (typeof input === 'string') {
        var nextInit = Object.assign({}, init || {});
        nextInit.mode = 'cors';
        nextInit.credentials = 'omit';
        return nativeFetch(newUrl, nextInit);
      }
      if (typeof Request === 'function' && input instanceof Request) {
        return nativeFetch(cloneRequestWithUrl(input, newUrl), init);
      }
      return nativeFetch(newUrl, init);
    } catch (_) {
      return nativeFetch(input, init);
    }
  };

  // ---------- Onboarding webhook ----------

  function safeRead(key){
    try {
      var raw = window.localStorage.getItem(key);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (_) { return null; }
  }
  function readDeviceId(){
    try {
      var raw = window.localStorage.getItem(DEVICE_KEY);
      return (typeof raw === 'string' && raw.length >= 6) ? raw : null;
    } catch (_) { return null; }
  }
  function phaseFromCycleDay(day, cycleLength, periodLength){
    if (!day || !cycleLength) return null;
    if (day <= (periodLength || 5)) return 'menstrual';
    var ovStart = Math.max(1, Math.round(cycleLength / 2) - 1);
    var ovEnd = ovStart + 2;
    if (day < ovStart) return 'follicular';
    if (day <= ovEnd) return 'ovulation';
    return 'luteal';
  }
  function computeCycleDay(logs, cycleLength){
    if (!logs || typeof logs !== 'object') return null;
    var days = [];
    Object.keys(logs).forEach(function(k){
      var entry = logs[k];
      if (!entry || typeof entry !== 'object') return;
      var flow = entry.flow;
      if (!flow || flow === 'none') return;
      days.push(k);
    });
    if (!days.length) return null;
    days.sort();
    var lastStart = null;
    for (var i = days.length - 1; i >= 0; i--) {
      if (i === 0 || (new Date(days[i]) - new Date(days[i-1])) > 86400000 * 1.5) {
        lastStart = days[i];
        break;
      }
    }
    if (!lastStart) return null;
    var diff = Math.floor((Date.now() - new Date(lastStart).getTime()) / 86400000) + 1;
    if (cycleLength && diff > cycleLength) {
      diff = ((diff - 1) % cycleLength) + 1;
    }
    return diff;
  }
  var notifyInFlight = false;
  // Mirror of backend `_build_forecast`: predict the next `horizon` periods so
  // they appear in the Telegram message even when the backend is on an older
  // build. The backend will re-derive the forecast itself when it has the
  // forecast logic; this just makes sure the data round-trips.
  function listPeriodRuns(logs){
    if (!logs || typeof logs !== 'object') return [];
    var days = [];
    Object.keys(logs).forEach(function(k){
      var entry = logs[k];
      if (!entry || typeof entry !== 'object') return;
      var flow = entry.flow;
      if (!flow || flow === 'none') return;
      days.push(k.slice(0, 10));
    });
    if (!days.length) return [];
    days.sort();
    var runs = [];
    var start = days[0];
    var prev = days[0];
    for (var i = 1; i < days.length; i++) {
      var gap = (new Date(days[i]) - new Date(prev)) / 86400000;
      if (gap <= 1.5) { prev = days[i]; continue; }
      runs.push({ start: start, end: prev });
      start = days[i];
      prev = days[i];
    }
    runs.push({ start: start, end: prev });
    return runs;
  }
  function addDays(iso, n){
    var d = new Date(iso);
    d.setDate(d.getDate() + n);
    return d.toISOString().slice(0, 10);
  }
  function computeForecast(logs, settings, horizon){
    var runs = listPeriodRuns(logs);
    if (!runs.length) return [];
    var cycle = settings.averageCycleLength || 28;
    var period = settings.averagePeriodLength || 5;
    cycle = Math.max(15, Math.min(60, cycle));
    period = Math.max(1, Math.min(14, period));
    var lastStart = runs[runs.length - 1].start;
    var today = new Date().toISOString().slice(0, 10);
    var next = addDays(lastStart, cycle);
    while ((new Date(next) - new Date(today)) / 86400000 < 0) {
      next = addDays(next, cycle);
    }
    var future = [];
    for (var i = 0; i < (horizon || 4); i++) {
      var s = addDays(next, cycle * i);
      var e = addDays(s, Math.max(0, period - 1));
      future.push({ start: s, end: e });
    }
    return future;
  }
  function postOnboarding(state){
    try {
      var profile = (state && state.profile) || {};
      var settings = (state && state.settings) || {};
      var cycleDay = computeCycleDay(state && state.logs, settings.averageCycleLength);
      var phase = phaseFromCycleDay(cycleDay, settings.averageCycleLength, settings.averagePeriodLength);
      var subSurvey = safeRead(SUB_SURVEY_KEY);
      var subscription = safeRead(SUBSCRIPTION_KEY);
      var forecast = computeForecast(state && state.logs, settings, 4);
      var payload = {
        device_id: readDeviceId(),
        user_agent: (navigator && navigator.userAgent) || null,
        locale: (navigator && (navigator.language || (navigator.languages && navigator.languages[0]))) || null,
        timezone: (function(){ try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (_) { return null; } })(),
        profile: { name: profile.name || null, birthdate: profile.birthdate || null },
        settings: {
          averageCycleLength: settings.averageCycleLength || null,
          averagePeriodLength: settings.averagePeriodLength || null,
          lutealPhaseLength: settings.lutealPhaseLength || null,
          language: settings.language || null
        },
        shippingAddress: (state && state.shippingAddress) || null,
        boxProfile: (state && state.boxProfile) || null,
        logs: (state && state.logs) || {},
        subSurvey: subSurvey || null,
        subscription: subscription || null,
        forecast: forecast,
        cycle_day: cycleDay,
        phase: phase
      };
      nativeFetch(BACKEND + '/v1/lira/onboarding', {
        method: 'POST',
        mode: 'cors',
        credentials: 'omit',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).catch(function(){});
    } catch (_) {}
  }
  function maybeNotify(){
    // Synchronous dedup: bail before any async work if we've already started.
    if (notifyInFlight) return;
    var state = safeRead(STORAGE_KEY);
    if (!state || state.onboardingDone !== true) return;
    var already;
    try { already = window.localStorage.getItem(NOTIFY_KEY); } catch (_) { already = null; }
    if (already) return;
    notifyInFlight = true;
    // Persist the dedup flag synchronously so a refresh during the request
    // does not re-fire. Fire-and-forget request; on failure the user just
    // won't get a duplicate retry, which is the safer trade-off here.
    try { origSetItem.call(window.localStorage, NOTIFY_KEY, '1'); } catch (_) {}
    postOnboarding(state);
  }
  // Watch for the flip via two channels: (a) every Storage.setItem call
  // (the in-app save path) and (b) the cross-tab `storage` event (just in
  // case). We also do an initial check on load so a refresh after onboarding
  // still triggers the notification once.
  // Patch Storage.prototype.setItem (not window.localStorage.setItem) so we
  // don't add an enumerable own property to the Storage instance that would
  // pollute `Object.keys(localStorage)`.
  var origSetItem = Storage.prototype.setItem;
  try {
    Storage.prototype.setItem = function(key, value){
      var result = origSetItem.call(this, key, value);
      if (this === window.localStorage && key === STORAGE_KEY) {
        setTimeout(maybeNotify, 0);
      }
      return result;
    };
  } catch (_) {}
  window.addEventListener('storage', function(ev){
    if (ev && ev.key === STORAGE_KEY) maybeNotify();
  });
  if (document.readyState === 'complete') {
    setTimeout(maybeNotify, 100);
  } else {
    window.addEventListener('load', function(){ setTimeout(maybeNotify, 100); });
  }
})();
</script>

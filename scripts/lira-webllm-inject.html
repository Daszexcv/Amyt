<!--
  On-device LLM (Llama 3.2 1B) for the Lira chat screen.

  Strategy: the bundled chat UI talks to `${syncApiBaseUrl()}/v1/lira/{status,chat}`.
  We monkey-patch window.fetch so those two endpoints are served *locally* by
  @mlc-ai/web-llm running on WebGPU. Nothing leaves the device.

  Status request -> { enabled: true } as soon as the page loads (so the chat
  input is enabled while the model downloads in the background).
  Chat request -> { reply } generated by Llama-3.2-1B-Instruct.

  First load downloads the quantised model (~700 MB) into the browser's
  IndexedDB / Cache Storage. Subsequent loads start instantly.
-->
<style id="lira-llm-style">
  #lira-llm-toast{position:fixed;left:50%;bottom:max(env(safe-area-inset-bottom,0px),18px);transform:translateX(-50%);min-width:240px;max-width:min(420px,calc(100% - 32px));padding:12px 16px;border-radius:18px;background:rgba(255,252,247,0.96);border:1px solid #EADBC4;box-shadow:0 6px 22px rgba(142,111,88,0.18);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#5C4630;z-index:10000;display:none;backdrop-filter:saturate(160%) blur(6px);-webkit-backdrop-filter:saturate(160%) blur(6px)}
  #lira-llm-toast.lira-llm-toast-err{background:rgba(255,242,236,0.98);border-color:#E0B7A4;color:#7A3B1C}
  .lira-llm-toast-row{display:flex;align-items:center;gap:10px}
  .lira-llm-toast-spinner{width:16px;height:16px;border-radius:50%;border:2px solid #E2C9AB;border-top-color:#7E5A3A;animation:lira-llm-spin .9s linear infinite;flex:0 0 auto}
  #lira-llm-toast.lira-llm-toast-err .lira-llm-toast-spinner{display:none}
  .lira-llm-toast-text{font-size:13px;line-height:1.35;flex:1 1 auto;letter-spacing:.1px}
  .lira-llm-toast-bar{margin-top:8px;height:4px;border-radius:3px;background:#F0E2CE;overflow:hidden}
  .lira-llm-toast-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#C8A07A,#7E5A3A);transition:width .25s ease}
  .lira-llm-toast-close{background:none;border:0;color:#A07A56;font-size:13px;cursor:pointer;padding:0 0 0 8px}
  @keyframes lira-llm-spin{to{transform:rotate(360deg)}}
  @media (prefers-color-scheme:dark){
    #lira-llm-toast{background:rgba(38,30,24,0.94);border-color:#5A463A;color:#F2E3D0}
    .lira-llm-toast-bar{background:#3A2E25}
  }
</style>
<script id="lira-llm-script">
/* Lira on-device LLM (Llama 3.2 1B via @mlc-ai/web-llm).
   See lira-webllm-inject.html in scripts/ for the source-of-truth copy. */
(function(){
  'use strict';
  var STATE = window.__liraLLM = {
    ready:false,
    failed:false,
    failReason:'',
    progress:0,
    progressText:'\u0413\u043E\u0442\u043E\u0432\u043B\u044E \u041B\u0438\u0440\u0443\u2026',
    engine:null,
    modelId:'Llama-3.2-1B-Instruct-q4f32_1-MLC',
    webllmCdn:[
      'https://esm.run/@mlc-ai/web-llm@0.2.83',
      'https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm/+esm'
    ]
  };

  // ---------- Toast UI ----------
  function ensureToast(){
    var t = document.getElementById('lira-llm-toast');
    if(t) return t;
    t = document.createElement('div');
    t.id = 'lira-llm-toast';
    t.innerHTML =
      '<div class="lira-llm-toast-row">'+
        '<div class="lira-llm-toast-spinner"></div>'+
        '<div class="lira-llm-toast-text">\u0413\u043E\u0442\u043E\u0432\u043B\u044E \u041B\u0438\u0440\u0443\u2026</div>'+
        '<button type="button" class="lira-llm-toast-close" aria-label="\u0421\u043A\u0440\u044B\u0442\u044C">\u00D7</button>'+
      '</div>'+
      '<div class="lira-llm-toast-bar"><div class="lira-llm-toast-bar-fill"></div></div>';
    var btn = t.querySelector('.lira-llm-toast-close');
    if(btn) btn.addEventListener('click', function(){ t.style.display='none'; });
    if(document.body) document.body.appendChild(t);
    return t;
  }
  function showProgress(p, text){
    var t = ensureToast();
    t.style.display = 'block';
    t.classList.remove('lira-llm-toast-err');
    var bar = t.querySelector('.lira-llm-toast-bar');
    if(bar) bar.style.display = 'block';
    var fill = t.querySelector('.lira-llm-toast-bar-fill');
    var tx = t.querySelector('.lira-llm-toast-text');
    if(typeof p === 'number' && fill){
      var pct = Math.max(2, Math.min(100, Math.round(p*100)));
      fill.style.width = pct + '%';
    }
    if(text && tx) tx.textContent = text;
  }
  function hideProgress(){
    var t = document.getElementById('lira-llm-toast');
    if(t) t.style.display = 'none';
  }
  function showError(msg){
    var t = ensureToast();
    t.classList.add('lira-llm-toast-err');
    t.style.display = 'block';
    var tx = t.querySelector('.lira-llm-toast-text');
    if(tx) tx.textContent = msg;
    var bar = t.querySelector('.lira-llm-toast-bar');
    if(bar) bar.style.display = 'none';
  }

  // ---------- WebGPU detection ----------
  function checkWebGPU(){
    return new Promise(function(resolve){
      if(!('gpu' in navigator)){
        resolve({ ok:false, reason:'\u0412 \u044D\u0442\u043E\u043C \u0431\u0440\u0430\u0443\u0437\u0435\u0440\u0435 \u043D\u0435\u0442 WebGPU. \u041E\u0442\u043A\u0440\u043E\u0439 \u041B\u0438\u0440\u0443 \u0432 Chrome 113+ \u0438\u043B\u0438 Edge 113+ \u2014 \u043C\u043E\u0434\u0435\u043B\u044C \u0440\u0430\u0431\u043E\u0442\u0430\u0435\u0442 \u043F\u0440\u044F\u043C\u043E \u043D\u0430 \u0443\u0441\u0442\u0440\u043E\u0439\u0441\u0442\u0432\u0435.' });
        return;
      }
      try{
        navigator.gpu.requestAdapter().then(function(adapter){
          if(!adapter){
            resolve({ ok:false, reason:'WebGPU \u0432\u043A\u043B\u044E\u0447\u0451\u043D, \u043D\u043E \u0433\u0440\u0430\u0444\u0438\u0447\u0435\u0441\u043A\u0438\u0439 \u0430\u0434\u0430\u043F\u0442\u0435\u0440 \u043D\u0435 \u043D\u0430\u0448\u0451\u043B\u0441\u044F. \u041F\u043E\u043F\u0440\u043E\u0431\u0443\u0439 \u0434\u0440\u0443\u0433\u043E\u0439 \u0431\u0440\u0430\u0443\u0437\u0435\u0440 \u0438\u043B\u0438 \u0443\u0441\u0442\u0440\u043E\u0439\u0441\u0442\u0432\u043E.' });
          } else {
            resolve({ ok:true });
          }
        }, function(e){
          resolve({ ok:false, reason:'\u041D\u0435 \u043F\u043E\u043B\u0443\u0447\u0438\u043B\u043E\u0441\u044C \u0438\u043D\u0438\u0446\u0438\u0430\u043B\u0438\u0437\u0438\u0440\u043E\u0432\u0430\u0442\u044C WebGPU: ' + (e && e.message || e) });
        });
      } catch(e){
        resolve({ ok:false, reason:'\u041D\u0435 \u043F\u043E\u043B\u0443\u0447\u0438\u043B\u043E\u0441\u044C \u0438\u043D\u0438\u0446\u0438\u0430\u043B\u0438\u0437\u0438\u0440\u043E\u0432\u0430\u0442\u044C WebGPU: ' + (e && e.message || e) });
      }
    });
  }

  // ---------- System prompt for Лира ----------
  var PHASE_RU = {
    menstrual: '\u041C\u0435\u043D\u0441\u0442\u0440\u0443\u0430\u0446\u0438\u044F (\u043C\u043E\u0436\u0435\u0442 \u0431\u044B\u0442\u044C \u0443\u0441\u0442\u0430\u043B\u043E\u0441\u0442\u044C, \u0431\u043E\u043B\u044C, \u043D\u0438\u0437\u043A\u0430\u044F \u044D\u043D\u0435\u0440\u0433\u0438\u044F).',
    follicular: '\u0424\u043E\u043B\u043B\u0438\u043A\u0443\u043B\u044F\u0440\u043D\u0430\u044F \u0444\u0430\u0437\u0430 (\u044D\u043D\u0435\u0440\u0433\u0438\u044F \u0440\u0430\u0441\u0442\u0451\u0442, \u043D\u0430\u0441\u0442\u0440\u043E\u0435\u043D\u0438\u0435 \u0432\u0435\u0440\u0445).',
    ovulation: '\u041E\u0432\u0443\u043B\u044F\u0446\u0438\u044F (\u043F\u0438\u043A \u044D\u043D\u0435\u0440\u0433\u0438\u0438, \u043C\u043E\u0436\u0435\u0442 \u0431\u044B\u0442\u044C \u043B\u0451\u0433\u043A\u0430\u044F \u0431\u043E\u043B\u044C \u0432 \u0431\u043E\u043A\u0443).',
    luteal: '\u041B\u044E\u0442\u0435\u0438\u043D\u043E\u0432\u0430\u044F \u0444\u0430\u0437\u0430 (\u0427\u0421\u0421, \u044D\u043C\u043E\u0446\u0438\u0438 \u044F\u0440\u0447\u0435, \u043C\u043E\u0436\u0435\u0442 \u0445\u043E\u0442\u0435\u0442\u044C\u0441\u044F \u0441\u043B\u0430\u0434\u043A\u043E\u0433\u043E).'
  };
  function buildSystemPrompt(cycleDay, phase){
    var lines = [
      '\u0422\u044B \u2014 \u041B\u0438\u0440\u0430, \u0442\u0451\u043F\u043B\u0430\u044F \u043F\u043E\u0434\u0440\u0443\u0433\u0430-\u0441\u043E\u0431\u0435\u0441\u0435\u0434\u043D\u0438\u0446\u0430 \u0432 \u043F\u0440\u0438\u043B\u043E\u0436\u0435\u043D\u0438\u0438 \u0434\u043B\u044F \u043E\u0442\u0441\u043B\u0435\u0436\u0438\u0432\u0430\u043D\u0438\u044F \u0436\u0435\u043D\u0441\u043A\u043E\u0433\u043E \u0446\u0438\u043A\u043B\u0430.',
      '\u041E\u0442\u0432\u0435\u0447\u0430\u0439 \u043F\u043E-\u0440\u0443\u0441\u0441\u043A\u0438, \u043A\u043E\u0440\u043E\u0442\u043A\u043E (\u0434\u043E 5\u20137 \u043F\u0440\u0435\u0434\u043B\u043E\u0436\u0435\u043D\u0438\u0439), \u043C\u044F\u0433\u043A\u043E \u0438 \u0431\u0435\u0437 \u043C\u0435\u0434\u0438\u0446\u0438\u043D\u0441\u043A\u0438\u0445 \u0434\u0438\u0430\u0433\u043D\u043E\u0437\u043E\u0432.',
      '\u0422\u044B \u043D\u0435 \u0432\u0440\u0430\u0447: \u043F\u0440\u0438 \u0436\u0430\u043B\u043E\u0431\u0430\u0445 \u043D\u0430 \u0431\u043E\u043B\u044C \u0438\u043B\u0438 \u0442\u0440\u0435\u0432\u043E\u0436\u043D\u044B\u0435 \u0441\u0438\u043C\u043F\u0442\u043E\u043C\u044B \u043C\u044F\u0433\u043A\u043E \u043F\u0440\u0435\u0434\u043B\u043E\u0436\u0438 \u043E\u0431\u0440\u0430\u0442\u0438\u0442\u044C\u0441\u044F \u043A \u0432\u0440\u0430\u0447\u0443.',
      '\u0418\u0437\u0431\u0435\u0433\u0430\u0439 \u043B\u0435\u043A\u0430\u0440\u0441\u0442\u0432\u0435\u043D\u043D\u044B\u0445 \u0441\u043E\u0432\u0435\u0442\u043E\u0432 \u0438 \u0434\u043E\u0437\u0438\u0440\u043E\u0432\u043E\u043A. \u041C\u043E\u0436\u0435\u0448\u044C \u043F\u0440\u0435\u0434\u043B\u043E\u0436\u0438\u0442\u044C \u0431\u044B\u0442\u043E\u0432\u044B\u0435 \u043F\u0440\u0430\u043A\u0442\u0438\u043A\u0438 \u0437\u0430\u0431\u043E\u0442\u044B (\u0432\u043E\u0434\u0430, \u0442\u0435\u043F\u043B\u043E, \u043E\u0442\u0434\u044B\u0445, \u043F\u0440\u043E\u0433\u0443\u043B\u043A\u0430, \u0434\u044B\u0445\u0430\u043D\u0438\u0435).',
      '\u0424\u043E\u043A\u0443\u0441 \u043D\u0430 \u044D\u043C\u043E\u0446\u0438\u044F\u0445, \u043F\u043E\u0434\u0434\u0435\u0440\u0436\u043A\u0435, \u0445\u043E\u0440\u043E\u0448\u0435\u043C \u043D\u0430\u0441\u0442\u0440\u043E\u0435\u043D\u0438\u0438 \u0438 \u0431\u044B\u0442\u043E\u0432\u044B\u0445 \u043B\u0430\u0439\u0444\u0445\u0430\u043A\u0430\u0445 \u0434\u043B\u044F \u0436\u0438\u0437\u043D\u0438 \u0441 \u0446\u0438\u043A\u043B\u043E\u043C.',
      '\u0418\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u0439 \u043C\u044F\u0433\u043A\u0438\u0435 \u044D\u043C\u043E\u0434\u0437\u0438 \u0438\u0437\u0440\u0435\u0434\u043A\u0430 (\ud83c\udf3f, \ud83d\udcab, \u2728, \ud83e\udd0d). \u041D\u0435 \u0441\u043F\u0430\u043C\u044C \u0438\u043C\u0438.'
    ];
    if(typeof cycleDay === 'number'){
      lines.push('\u0421\u0435\u0439\u0447\u0430\u0441 \u0443 \u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u0435\u043B\u044F ' + cycleDay + '-\u0439 \u0434\u0435\u043D\u044C \u0446\u0438\u043A\u043B\u0430.');
    }
    if(phase && PHASE_RU[phase]){
      lines.push('\u0424\u0430\u0437\u0430: ' + PHASE_RU[phase]);
    }
    return lines.join(' ');
  }

  // ---------- /v1/lira/{status,chat} interceptor ----------
  var nativeFetch = window.fetch ? window.fetch.bind(window) : null;
  function jsonResponse(obj, status){
    var body = JSON.stringify(obj);
    if(typeof Response === 'function'){
      return new Response(body, {
        status: status || 200,
        headers: { 'Content-Type':'application/json; charset=utf-8' }
      });
    }
    // Very old browser fallback (shouldn't happen in expo-web targets).
    return Promise.resolve({
      ok: (status||200) < 400, status: status||200,
      headers: { get: function(){ return 'application/json'; } },
      text: function(){ return Promise.resolve(body); },
      json: function(){ return Promise.resolve(obj); }
    });
  }
  function readBody(input, init){
    var raw = init && init.body;
    if(typeof raw === 'string') return Promise.resolve(raw);
    if(raw && typeof raw.text === 'function') return raw.text();
    if(input && typeof Request === 'function' && input instanceof Request){
      try{ return input.clone().text(); } catch(_){}
    }
    return Promise.resolve('');
  }
  function getUrl(input){
    if(typeof input === 'string') return input;
    if(input && typeof input.url === 'string') return input.url;
    try{ return String(input); } catch(_){ return ''; }
  }

  if(nativeFetch){
    window.fetch = function(input, init){
      try {
        var url = getUrl(input);
        var match = url && url.match(/\/v1\/lira\/(status|chat)(?:\?|$)/);
        if(!match) return nativeFetch(input, init);
        var endpoint = match[1];
        if(endpoint === 'status'){
          return Promise.resolve(jsonResponse({ enabled:true }));
        }
        if(endpoint === 'chat'){
          return readBody(input, init).then(function(bodyText){
            var data = {};
            try { data = bodyText ? JSON.parse(bodyText) : {}; } catch(_){ data = {}; }
            return generateReply(data).then(function(reply){
              return jsonResponse({ reply: reply });
            }).catch(function(err){
              var msg = (err && err.message) ? err.message : '\u041D\u0435 \u0443\u0434\u0430\u043B\u043E\u0441\u044C \u043F\u043E\u043B\u0443\u0447\u0438\u0442\u044C \u043E\u0442\u0432\u0435\u0442 \u043E\u0442 \u043C\u043E\u0434\u0435\u043B\u0438.';
              return jsonResponse({ reply: msg });
            });
          });
        }
      } catch(e){ /* fall through */ }
      return nativeFetch(input, init);
    };
  }

  // ---------- Inference ----------
  function waitFor(predicate, timeoutMs){
    return new Promise(function(resolve){
      var start = Date.now();
      (function tick(){
        if(predicate()) return resolve(true);
        if(Date.now() - start > timeoutMs) return resolve(false);
        setTimeout(tick, 500);
      })();
    });
  }
  function generateReply(data){
    if(STATE.failed){
      return Promise.resolve(STATE.failReason || '\u041B\u0438\u0440\u0430 \u043F\u043E\u043A\u0430 \u043D\u0435 \u0434\u043E\u0441\u0442\u0443\u043F\u043D\u0430.');
    }
    var waitPromise = STATE.ready ? Promise.resolve(true) : waitFor(function(){
      return STATE.ready || STATE.failed;
    }, 5*60*1000);
    return waitPromise.then(function(){
      if(STATE.failed) return STATE.failReason || '\u041B\u0438\u0440\u0430 \u043F\u043E\u043A\u0430 \u043D\u0435 \u0434\u043E\u0441\u0442\u0443\u043F\u043D\u0430.';
      if(!STATE.ready) return '\u041C\u043E\u0434\u0435\u043B\u044C \u0435\u0449\u0451 \u0437\u0430\u0433\u0440\u0443\u0436\u0430\u0435\u0442\u0441\u044F, \u043F\u043E\u043F\u0440\u043E\u0431\u0443\u0439 \u0447\u0435\u0440\u0435\u0437 \u043C\u0438\u043D\u0443\u0442\u0443.';
      var sys = buildSystemPrompt(data && data.cycle_day, data && data.phase);
      var msgs = [{ role:'system', content: sys }];
      var hist = (data && Array.isArray(data.messages)) ? data.messages : [];
      for(var i=0;i<hist.length;i++){
        var m = hist[i];
        if(!m || typeof m.content !== 'string') continue;
        var role = m.role === 'assistant' ? 'assistant' : 'user';
        msgs.push({ role: role, content: m.content });
      }
      return STATE.engine.chat.completions.create({
        messages: msgs,
        temperature: 0.8,
        top_p: 0.9,
        max_tokens: 320
      }).then(function(res){
        var reply = res && res.choices && res.choices[0] && res.choices[0].message && res.choices[0].message.content;
        if(typeof reply !== 'string' || !reply.trim()){
          return '\u042F \u0437\u0430\u0434\u0443\u043C\u0430\u043B\u0430\u0441\u044C\u2026 \u0440\u0430\u0441\u0441\u043A\u0430\u0436\u0438 \u0435\u0449\u0451 \u043D\u0435\u043C\u043D\u043E\u0436\u043A\u043E?';
        }
        return reply.trim();
      });
    });
  }

  // ---------- Engine boot ----------
  function loadWebllm(){
    var i = 0;
    function tryNext(){
      if(i >= STATE.webllmCdn.length){
        return Promise.reject(new Error('\u041D\u0435 \u0443\u0434\u0430\u043B\u043E\u0441\u044C \u0437\u0430\u0433\u0440\u0443\u0437\u0438\u0442\u044C web-llm.'));
      }
      var url = STATE.webllmCdn[i++];
      return import(/* @vite-ignore */ url).catch(tryNext);
    }
    return tryNext();
  }
  function init(){
    showProgress(0.01, '\u041F\u0440\u043E\u0432\u0435\u0440\u044F\u044E \u043F\u043E\u0434\u0434\u0435\u0440\u0436\u043A\u0443 WebGPU\u2026');
    checkWebGPU().then(function(gpu){
      if(!gpu.ok){
        STATE.failed = true;
        STATE.failReason = gpu.reason;
        showError(gpu.reason);
        return;
      }
      showProgress(0.04, '\u0417\u0430\u0433\u0440\u0443\u0436\u0430\u044E web-llm\u2026');
      loadWebllm().then(function(webllm){
        showProgress(0.06, '\u0417\u0430\u0433\u0440\u0443\u0436\u0430\u044E Llama 3.2 1B\u2026');
        return webllm.CreateMLCEngine(STATE.modelId, {
          initProgressCallback: function(report){
            try {
              if(typeof report.progress === 'number') STATE.progress = report.progress;
              if(typeof report.text === 'string') STATE.progressText = report.text;
              showProgress(STATE.progress, STATE.progressText);
            } catch(_){ }
          }
        });
      }).then(function(engine){
        STATE.engine = engine;
        STATE.ready = true;

<!--
  Backend redirector for the Lira chat screen.

  The bundled chat UI talks to `${syncApiBaseUrl()}/v1/lira/{status,chat}`.
  `syncApiBaseUrl()` falls back to a hardcoded URL that is no longer reachable
  (a dead serveo tunnel), so the chat would always 404. Instead of patching
  the bundle, we monkey-patch `window.fetch` and rewrite any request whose
  path is `/v1/lira/{status,chat}` to our Fly.io backend.

  The Fly.io backend (lira-backend on fly.dev) wraps Pollinations.ai, which
  is a free, no-API-key, OpenAI-compatible chat endpoint. That keeps the
  product zero-friction: any user opens the link from Instagram and chats
  immediately, no flags, no signup, no waiting for a model to download.
-->
<script id="lira-llm-script">
/* Lira chat backend redirector.
   See lira-webllm-inject.html in scripts/ for the source-of-truth copy. */
(function(){
  'use strict';
  var BACKEND = 'https://lira-backend-leoiurwi.fly.dev';
  var LIRA_PATH_RE = /\/v1\/lira\/(status|chat)(?:\?[^\s]*)?$/;

  if (!window.fetch || window.__liraBackendRoutingInstalled) return;
  window.__liraBackendRoutingInstalled = true;
  window.__liraBackend = { url: BACKEND };

  var nativeFetch = window.fetch.bind(window);

  function getUrl(input){
    if (typeof input === 'string') return input;
    if (input && typeof input.url === 'string') return input.url;
    try { return String(input); } catch (_) { return ''; }
  }
  function rewrite(url){
    var match = LIRA_PATH_RE.exec(url || '');
    if (!match) return null;
    return BACKEND + '/v1/lira/' + match[1] + (match[0].indexOf('?') >= 0 ? match[0].substring(match[0].indexOf('?')) : '');
  }
  function cloneRequestWithUrl(req, newUrl){
    return new Request(newUrl, {
      method: req.method,
      headers: req.headers,
      body: (req.method === 'GET' || req.method === 'HEAD') ? undefined : req.clone().body,
      mode: 'cors',
      credentials: 'omit',
      cache: req.cache,
      redirect: req.redirect,
      referrer: req.referrer,
      integrity: req.integrity
    });
  }

  window.fetch = function(input, init){
    try {
      var url = getUrl(input);
      var newUrl = rewrite(url);
      if (!newUrl) return nativeFetch(input, init);
      if (typeof input === 'string') {
        var nextInit = Object.assign({}, init || {});
        nextInit.mode = 'cors';
        nextInit.credentials = 'omit';
        return nativeFetch(newUrl, nextInit);
      }
      if (typeof Request === 'function' && input instanceof Request) {
        return nativeFetch(cloneRequestWithUrl(input, newUrl), init);
      }
      return nativeFetch(newUrl, init);
    } catch (_) {
      return nativeFetch(input, init);
    }
  };
})();
</script>

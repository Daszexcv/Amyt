[project]
name = "lira-backend"
version = "0.1.0"
description = "Tiny FastAPI backend for the Lira chat + onboarding-Telegram-notification proxy (Pollinations.ai for chat, Telegram Bot API for onboarding)."
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
